name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  # Lets a feature branch be validated before it has a pull request open.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug
        run: gradle assembleDebug
      - name: Lint
        run: gradle lintDebug
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkframe-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkframe-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: darkframe-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Lint summary
        if: always()
        run: |
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          from collections import Counter
          path = "app/build/reports/lint-results-debug.xml"
          if not os.path.exists(path):
              print("No lint report produced.")
              raise SystemExit(0)
          issues = list(ET.parse(path).getroot().iter("issue"))
          counts = Counter((i.get("severity"), i.get("id")) for i in issues)
          print(f"{len(issues)} lint issue(s)")
          for (severity, issue_id), count in sorted(counts.items(), key=lambda kv: -kv[1]):
              print(f"  {severity:8} {issue_id:34} x{count}")
              example = next(i for i in issues if i.get("id") == issue_id)
              location = example.find("location")
              where = location.get("file", "?") if location is not None else "?"
              print(f"           e.g. {os.path.relpath(where, os.getcwd()) if where.startswith('/') else where}")
              print(f"           {example.get('message')}")
          PY
